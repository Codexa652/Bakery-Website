<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | The Golden Crumb</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600&family=Poppins:wght@300;400;500;600&display=swap');

        :root {
            --primary-bg: #fffbf5;
            --primary-color: #5c3d2e;
            --secondary-color: #e08f62;
            --text-main: #333;
            --text-light: #666;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--primary-bg);
            display: flex;
            min-height: 100vh;
        }

        .auth-container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            margin: auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            min-height: 600px;
        }

        .auth-img {
            flex: 1;
            background-image: linear-gradient(rgba(92, 61, 46, 0.4), rgba(92, 61, 46, 0.4)), url('https://images.unsplash.com/photo-1509440159596-0249088772ff?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80');
            background-size: cover;
            background-position: center;
            display: none;
        }

        @media (min-width: 768px) {
            .auth-img {
                display: block;
            }
        }

        .auth-form-container {
            flex: 1;
            padding: 4rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .back-link {
            text-decoration: none;
            color: var(--text-light);
            font-size: 0.9rem;
            margin-bottom: 2rem;
            display: inline-block;
            transition: var(--transition);
        }

        .back-link:hover {
            color: var(--primary-color);
        }

        h2 {
            font-family: 'Playfair Display', serif;
            color: var(--primary-color);
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            color: var(--text-light);
            margin-bottom: 2rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
            position: relative;
        }

        .input-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.9rem;
            color: var(--text-main);
            font-weight: 500;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px 12px 40px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            font-size: 1rem;
            transition: var(--transition);
        }

        .input-group input:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(224, 143, 98, 0.1);
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 40px;
            color: var(--text-light);
            font-size: 1rem;
        }

        .options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .options a {
            color: var(--secondary-color);
            text-decoration: none;
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn:hover {
            background: #4a3125;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(92, 61, 46, 0.3);
        }

        .toggle-form {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.95rem;
            color: var(--text-light);
        }

        .toggle-form a {
            color: var(--secondary-color);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <div class="auth-container">
        <div class="auth-img"></div>
        <div class="auth-form-container">
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Bakery</a>

            <!-- Login Form Default -->
            <div id="login-form-view">
                <h2>Welcome Back</h2>
                <p class="subtitle">Log in to manage your special orders.</p>
                <form onsubmit="handleAuth(event, 'index.html')">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" required placeholder="hello@example.com">
                    </div>
                    <div class="input-group">
                        <label for="password">Password</label>
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                    <div class="options">
                        <label><input type="checkbox"> Remember me</label>
                        <a href="#">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn">Sign In</button>
                </form>
                <div class="toggle-form">
                    Don't have an account? <a href="#" onclick="toggleView()">Create one</a>
                </div>
            </div>

            <!-- Signup Form Hidden by Default -->
            <div id="signup-form-view" style="display: none;">
                <h2>Create Account</h2>
                <p class="subtitle">Join our bakery rewards program.</p>
                <form onsubmit="handleAuth(event, 'index.html')">
                    <div class="input-group">
                        <label for="name">Full Name</label>
                        <i class="fas fa-user"></i>
                        <input type="text" id="name" required placeholder="John Doe">
                    </div>
                    <div class="input-group">
                        <label for="reg-email">Email Address</label>
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="reg-email" required placeholder="hello@example.com">
                    </div>
                    <div class="input-group">
                        <label for="reg-password">Password</label>
                        <i class="fas fa-lock"></i>
                        <input type="password" id="reg-password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn">Sign Up</button>
                </form>
                <div class="toggle-form">
                    Already have an account? <a href="#" onclick="toggleView()">Sign in</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleView() {
            const login = document.getElementById('login-form-view');
            const signup = document.getElementById('signup-form-view');
            if (login.style.display === 'none') {
                login.style.display = 'block';
                signup.style.display = 'none';
            } else {
                login.style.display = 'none';
                signup.style.display = 'block';
            }
        }

        function handleAuth(e, url) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.textContent;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.style.opacity = '0.8';

            setTimeout(() => {
                localStorage.setItem('goldenCrumbUser', 'true');
                window.location.href = url;
            }, 2000);
        }
    </script>
</body>

</html>
